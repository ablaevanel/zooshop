{% extends "base.html" %}
{% load static %}
{% block title %}
  Главная страница
{% endblock %}
{% block content %}
  <div class="d-flex justify-content-center align-items-center" style="height: 30vh;">
    <h1 class="mb-5 text-center fw-bold p-5" 
        style="color: #4747ff; 
              background: linear-gradient(135deg, #4747ff, #00d4ff); 
              background-clip: text;
              color: transparent; 
              font-size: 3rem; 
              text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
              padding: 15px 30px; 
              border-radius: 15px;">
      Зоомагазин PetLovers
    </h1>
  </div>

  <div class="d-flex justify-content-center align-items-center" style="height: 39vh">
    <a href="{% url 'catalog:product_list' %}" 
        class="btn btn-gradient text-white btn-lg px-5 py-3 shadow-lg rounded-pill text-uppercase" 
        style="background: linear-gradient(45deg, #4747ff, #00d4ff); border: none; transition: transform 0.2s ease;">
      Перейти в каталог
    </a>
  </div>

<style>
  .btn-gradient:hover {
    transform: scale(1.1);
  }
</style>
{% endblock %}
