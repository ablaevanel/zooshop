{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<div style="min-height: 70vh">
  <div class="card col-4 m-3">
    <div class="card-header text-primary">
      Восстановить пароль
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {% bootstrap_form form %}
        {% bootstrap_button button_type="submit" content="Отправить" %}
      </form>
    </div>
  </div>
</div>
{% endblock %}
