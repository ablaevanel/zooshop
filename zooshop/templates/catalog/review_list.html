{% extends "base.html" %}
{% load static %}
{% block title %}
  Отзывы
{% endblock %}
{% block content %}
<div style="min-height: 70vh;">
<h1 class="mb-5 text-center fw-bold p-0" 
        style="color: #4747ff; 
              background: linear-gradient(135deg, #4747ff, #00d4ff); 
              background-clip: text;
              color: transparent; 
              font-size: 3rem; 
              text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
              border-radius: 15px;">
    Отзывы
</h1>
<div class="row mt-3">
    <div class="col-12 col-md-6 mb-4">
      <div class="card shadow-sm border-0 rounded">
        <div class="card-body">
          <h2 class="h4 text-primary">Цена</h2>
          <p class="fs-4 text-success">{{ price }} ₽</p>
          <h2 class="h4 text-primary">Описание</h2>
          <p>{{ description }}</p>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-4 mb-3">
      <div class="image-wrapper" style="border: 3px solid #ddd; border-radius: 10px; padding: 5px;">
        <img 
          class="img-fluid rounded" 
          height="400" width="400" 
          src="{% static 'img/image-holder.png' %}" alt="{{ name }}">
      </div>
    </div>    
  </div>
    {% for review in reviews %}
    <div class="col-6 col-md-4 my-1" style="background: white; padding: 20px; border-radius: 20px; width: 30vw;">
        <p class="card-text">
            <p>
                Отзыв: {{ review.text }}
            </p>
            <p>
                Оценка: {{ review.rating }}
            </p>
        </p>
    </div>
    {% endfor %}
</div>
{% endblock %}
